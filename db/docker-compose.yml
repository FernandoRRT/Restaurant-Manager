services:
  postgres:
    container_name: postgres_fintech
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pswroot
      POSTGRES_DB: fintech_db
    # Expose the Postgres port to the host machine,
    # so you can inspect and administrate it
    ports:
      - '54320:5432'
    # volumes:
    #   - C:\Users\cario\work\postgres-data:/var/lib/postgresql/data

  pg_proxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPEND_PORT: 'postgres:5432'
      ALLOW_ADDR_REGEX: '.*'
      LOG_TRAFFIC: 'true'
    ports:
      # Expose the WebSocket proxy port to the host machine,
      # this is where @vercel/postgres will connect
      - '54330:80'
    depends_on:
      - postgres
